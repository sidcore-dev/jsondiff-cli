[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jsondiff-cli"
version = "1.0.0"
description = "Compare two JSON files and print a path-based, colorized diff from the command line."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "All Rights Reserved" }
authors = [{ name = "sidcore-dev" }]
keywords = ["json", "diff", "cli", "devtools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Environment :: Console",
    "Topic :: Software Development :: Debuggers",
]

[project.scripts]
jsondiff-cli = "jsondiff_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
